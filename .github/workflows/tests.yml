name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      # The suite needs no network and no credentials: HTTP is mocked and PDF
      # fixtures are generated in code.
      - name: Test
        run: python -m pytest -q

      - name: Self-test on an uncredentialled machine
        run: turbosign-mcp --selftest
