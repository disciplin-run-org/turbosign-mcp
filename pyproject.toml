[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbosign-mcp"
version = "0.3.0"
description = "Thin stdio MCP server for the TurboSign e-signature API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jesper Jurcenoks" }]
dependencies = [
    "fastmcp>=2.14.0",
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/disciplin-run-org/turbosign-mcp"

[project.scripts]
turbosign-mcp = "turbosign_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
